
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir project
          unzip -q XAU_Trader_MT5_Connected_Architecture_FIXED.zip -d project

      - name: Fix Java and Kotlin targets
        working-directory: project/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          start = s.index("android {")
          depth = 0
          end = None
          for i in range(start, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          block = s[start:end+1]
          if "compileOptions" not in block:
              block = block[:-1] + '''
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          '''
          if "kotlinOptions" not in block:
              block = block[:-1] + '''
              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
          s = s[:start] + block + s[end+1:]
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: project/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Trader-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
