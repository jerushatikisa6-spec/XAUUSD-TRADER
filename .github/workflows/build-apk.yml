name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir project
          unzip -q XAU_Trader_MT5_Connected_Architecture_FIXED.zip -d project

      - name: Build APK
        working-directory: project/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Trader-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
